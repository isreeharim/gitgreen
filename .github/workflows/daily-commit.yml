name: Daily Contribution Generator

on:
  schedule:
    # Runs at 04:30 and 15:30 UTC every day (twice daily for consistency)
    - cron: '30 4,15 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update Activity Log
        run: |
          echo "Activity on $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> activity.log

      - name: Commit and Push Changes
        run: |
          git config --local user.name "isreeharim"
          git config --local user.email "isreeharim@gmail.com"
          git add activity.log
          git commit -m "chore(activity): update daily log [skip ci]" || exit 0
          git push origin main
