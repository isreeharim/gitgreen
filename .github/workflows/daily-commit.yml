name: Daily Contribution Generator

on:
  schedule:
    # Runs every day at 04:30 UTC (10:00 AM IST)
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      min_commits:
        description: 'Minimum commits'
        required: false
        default: '15'
      max_commits:
        description: 'Maximum commits'
        required: false
        default: '20'

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Random Commits
        run: |
          MIN=${{ inputs.min_commits || '15' }}
          MAX=${{ inputs.max_commits || '20' }}
          python generate_commits.py --min "$MIN" --max "$MAX"

      - name: Push Commits
        run: |
          git push origin main
